name: Validate HTML & CSS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          html-validate index.html projects.html media.html research.html support.html documents.html documentation.html || true

      - name: Check for broken image references
        run: |
          echo "Image placeholders ready in images/ folder. Upload real assets and they will display automatically."
